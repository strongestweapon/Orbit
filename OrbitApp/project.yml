name: Orbit
options:
  bundleIdPrefix: studio.superless
  deploymentTarget:
    macOS: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_APP_SANDBOX: NO
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: 16
targets:
  Orbit:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    info:
      path: Info.plist
      properties:
        CFBundleIconFile: OrbitAppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://raw.githubusercontent.com/strongestweapon/Orbit/main/updates/appcast.xml
        SUPublicEDKey: IH1jwQkJIZ7iiiiiySwuj0pLJMosW1AbS4T+6gOzlqU=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
        OrbitMinimumAutoupdateVersion: "15"
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
        SUSignedFeedFailureExpirationInterval: 0
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      - path: ../OrbitShaders/metal
        type: folder
        buildPhase: resources
      - path: ../OrbitTextures/textures
        type: folder
        buildPhase: resources
      - path: ../OrbitShaders/config
        type: folder
        buildPhase: resources
      - path: ../KakaoTalk_Video_2026-11-10-09-37-08.mp4
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.superless.Orbit
        INFOPLIST_KEY_CFBundleDisplayName: Orbit
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "현장 센서의 OSC 데이터를 수신합니다."
        INFOPLIST_KEY_NSHumanReadableCopyright: "SUPERLESS"
schemes:
  Orbit:
    build:
      targets:
        Orbit: all
    run:
      config: Release
      debugEnabled: false
      enableGPUFrameCaptureMode: disabled
      enableGPUValidationMode: false
